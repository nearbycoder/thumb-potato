name: ThumbPotato
options:
  bundleIdPrefix: com.nearbycoder
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4F2YLTHL8T
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThumbPotato:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ThumbPotato
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: ThumbPotato/Resources/ThumbPotato.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.nearbycoder.thumbpotato]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.calendars: true
    info:
      path: ThumbPotato/Resources/Info.plist
      properties:
        CFBundleDisplayName: Thumb Potato
        CFBundleName: Thumb Potato
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [remote-notification]
        NSCalendarsFullAccessUsageDescription: Thumb Potato adds your planned play sessions to your calendar.
        NSCalendarsWriteOnlyAccessUsageDescription: Thumb Potato adds your planned play sessions to your calendar.
        RAWGAPIKey: $(RAWG_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.nearbycoder.thumbpotato
            CFBundleURLSchemes: [thumbpotato]
        LSApplicationQueriesSchemes: [steam]
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nearbycoder.thumbpotato
        PRODUCT_NAME: ThumbPotato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ThumbPotatoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [ThumbPotatoTests]
    dependencies:
      - target: ThumbPotato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ThumbPotato:
    build:
      targets:
        ThumbPotato: all
        ThumbPotatoTests: [test]
    test:
      targets: [ThumbPotatoTests]
