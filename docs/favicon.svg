      <ellipse cx="322" cy="512" rx="64" ry="50" fill="#2A2E36"/>
    </g>
    <!-- face buttons -->
    <circle cx="700" cy="452" r="38" fill="#0E1014"/>
    <circle cx="700" cy="588" r="38" fill="#0E1014"/>
    <circle cx="632" cy="520" r="38" fill="#0E1014"/>
    <circle cx="768" cy="520" r="38" fill="#0E1014"/>
